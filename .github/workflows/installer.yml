name: installer

# Builds the OpsIntel MSI (and, on request, the optional Burn bundle) on
# windows-latest, then installs it and smoke-tests it on a second
# windows-latest runner. ADR-0005/ADR-0006. Sources: docs/research/notes/
# msi_kurulum_dagitim.md §9, docs/adr/0005-single-msi-wix-v7.md,
# docs/adr/0006-code-signing.md.
#
# IMPORTANT ASSUMPTIONS (verify in Faz 0):
# - windows-latest = windows-2025 as of 2026-09-27 and ships only WiX 3.14.1
#   preinstalled. We do NOT rely on it: installer/Directory.Build.props pins
#   WixToolset.Sdk/7.0.0 and it is restored from NuGet by `dotnet build` like
#   any other SDK-style project — no `wix` CLI / global tool install needed,
#   and no assumption that any WiX version is preinstalled on the runner.
# - src/OpsIntel.Host and src/OpsIntel.Intelligence are owned by a parallel
#   workstream. This workflow fails clearly (via tools/build.ps1's own guard)
#   if they are not present yet, rather than silently producing an empty MSI.
# - Signing is entirely conditional on secrets being configured. A step's
#   `if:` cannot reference `secrets.*` directly (GitHub Actions rejects that
#   expression at parse time, which is why this workflow previously showed 0
#   jobs on every run) — so the secret is mapped to a job-level `env` var
#   once, and every conditional below reads `env.SIGNING_THUMBPRINT` instead.
#   Until an ADR-0006 signing vendor is contracted, this workflow still builds
#   and uploads an UNSIGNED MSI artifact so the installer skeleton itself can
#   be reviewed/tested.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_bundle:
        description: "Also build the optional Burn bundle (installer/Bundle)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-msi:
    name: Build MSI
    runs-on: windows-latest
    env:
      # Secrets cannot be used directly in a step `if:` expression — map it to
      # a job-level env var once and test `env.SIGNING_THUMBPRINT` instead.
      SIGNING_THUMBPRINT: ${{ secrets.OPSINTEL_SIGNING_CERT_THUMBPRINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Matches global.json; keep in sync with it (ADR-0002, .NET 10 LTS).
          dotnet-version: "10.0.x"

      - name: Enable corepack (pnpm) for the optional SPA build
        shell: pwsh
        run: |
          # tools/build.ps1 shells out to `pnpm` to build src/web when it is
          # present; corepack ships with Node (preinstalled on windows-latest)
          # but pnpm itself must be enabled once before it is callable.
          corepack enable

      - name: Compute build version
        id: version
        shell: pwsh
        run: |
          # ADR-0022: MSI ignores the 4th version field; only the first three
          # matter for MajorUpgrade comparisons. MSI also requires major < 256,
          # minor < 256 and build < 65536 (ICE24), so a year-based major such as
          # 2026 is invalid. Faz 0 builds use 0.1.<run number>, which stays
          # monotonically increasing without needing a tag.
          $version = "0.1.${{ github.run_number }}"
          Write-Host "Resolved version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build MSI (and optional bundle)
        shell: pwsh
        run: |
          $bundleSwitch = @()
          if ('${{ github.event.inputs.build_bundle }}' -eq 'true') {
            $bundleSwitch = @('-Bundle')
          }
          ./tools/build.ps1 -Version '${{ steps.version.outputs.version }}' @bundleSwitch

      - name: Sign build outputs
        shell: pwsh
        # Conditional on secrets being present, per ADR-0006: a Türkiye legal
        # entity cannot use Azure Artifact Signing's Public Trust profile, so
        # no first-party GitHub Action is assumed here. Until an OV
        # cert/cloud-HSM vendor is contracted (ADR-0006 "Doğrulama / açık
        # noktalar"), this step is skipped rather than failing the build.
        if: env.SIGNING_THUMBPRINT != ''
        run: |
          ./tools/sign.ps1 -CertificateThumbprint $env:SIGNING_THUMBPRINT

      - name: Skip-signing notice
        shell: pwsh
        if: env.SIGNING_THUMBPRINT == ''
        run: |
          Write-Warning "OPSINTEL_SIGNING_CERT_THUMBPRINT secret is not set — uploading an UNSIGNED MSI. See ADR-0006 (signing vendor selection pending)."

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpsIntel-x64-msi
          path: artifacts/installer/OpsIntel-x64.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload bundle artifact
        if: ${{ github.event.inputs.build_bundle == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpsIntelSetup-exe
          path: installer/Bundle/bin/x64/Release/OpsIntelSetup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload install logs (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-build-logs
          path: |
            installer/**/*.log
            **/msbuild.binlog
          if-no-files-found: ignore
          retention-days: 14

  install-smoke:
    name: Install + smoke test MSI
    needs: build-msi
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: OpsIntel-x64-msi
          path: .

      - name: Install OpsIntel silently
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $PWD 'OpsIntel-x64.msi'
          if (-not (Test-Path $msi)) {
            throw "Downloaded artifact does not contain OpsIntel-x64.msi"
          }

          $logPath = Join-Path $PWD 'install.log'
          # No TENANT_ID/CLIENT_ID on purpose: this exercises the "not
          # configured" path (item 4 of the OpsIntel Faz 0 review) — the Host
          # must still start and answer /health/live with an empty ClientId.
          $msiArgs = @('/i', "`"$msi`"", '/qn', '/norestart', 'PORT=6500', '/l*v', "`"$logPath`"")
          $proc = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
          Write-Host "msiexec exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -notin @(0, 3010)) {
            Get-Content $logPath -Tail 200 | Write-Host
            throw "msiexec /i failed with exit code $($proc.ExitCode)"
          }

      - name: Wait for services to be Running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Wait-ServiceRunning([string]$name, [int]$timeoutSeconds = 60) {
            $deadline = (Get-Date).AddSeconds($timeoutSeconds)
            while ((Get-Date) -lt $deadline) {
              $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -eq 'Running') {
                Write-Host "$name is Running"
                return
              }
              Start-Sleep -Seconds 2
            }
            $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
            $status = if ($svc) { $svc.Status } else { '<not found>' }
            throw "Service '$name' did not reach Running within ${timeoutSeconds}s (last status: $status)"
          }

          Wait-ServiceRunning -Name 'OpsIntel.Host'
          Wait-ServiceRunning -Name 'OpsIntel.AI'

      - name: Check port 6500 is listening on loopback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Test-NetConnection -ComputerName 127.0.0.1 -Port 6500
          if (-not $result.TcpTestSucceeded) {
            throw "Port 6500 is not reachable on 127.0.0.1"
          }
          Write-Host "127.0.0.1:6500 is reachable."

      - name: Check port 6500 is NOT bound on 0.0.0.0 (ADR-0003 loopback-only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $anyBind = Get-NetTCPConnection -LocalPort 6500 -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalAddress -in @('0.0.0.0', '::') }
          if ($anyBind) {
            $anyBind | Format-Table | Out-String | Write-Host
            throw "OpsIntel.Host is bound on a wildcard address; ADR-0003 requires loopback-only binding."
          }
          Write-Host "Confirmed: no listener on 0.0.0.0/[::] for port 6500."

      - name: GET /health/live over HTTPS (self-signed, -k)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $maxAttempts = 15
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              $status = & curl.exe -k -s -o NUL -w "%{http_code}" https://localhost:6500/health/live
              if ($status -eq '200') {
                Write-Host "health/live returned 200 (attempt $i)"
                exit 0
              }
              Write-Host "Attempt $i`: got HTTP $status, retrying..."
            } catch {
              Write-Host "Attempt $i`: request failed ($_), retrying..."
            }
            Start-Sleep -Seconds 3
          }
          throw "https://localhost:6500/health/live did not return 200 after $maxAttempts attempts"

      - name: Check certificate chain trust (informational, non-fatal)
        shell: pwsh
        continue-on-error: true
        run: |
          # Without -k: curl fails if the cert chain is not trusted. The
          # self-signed dev certificate OpsIntel.SetupHelper provisions is
          # trusted into LocalMachine\Root by CertificateInstaller, so this is
          # expected to succeed — but this step must never fail the build on
          # its own; it only reports what it finds (task explicitly asks for
          # "report but don't fail if untrusted").
          & curl.exe -s -o NUL -w "certificate chain trust check: HTTP %{http_code}, ssl_verify_result %{ssl_verify_result}`n" https://localhost:6500/health/live
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "curl.exe (no -k) failed with exit code $LASTEXITCODE — certificate chain is not trusted by this process. Logged, not failing the build."
          }

      - name: Uninstall OpsIntel silently
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $PWD 'OpsIntel-x64.msi'
          $logPath = Join-Path $PWD 'uninstall.log'
          $msiArgs = @('/x', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$logPath`"")
          $proc = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
          Write-Host "msiexec /x exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -notin @(0, 3010)) {
            Get-Content $logPath -Tail 200 | Write-Host
            throw "msiexec /x failed with exit code $($proc.ExitCode)"
          }

      - name: Assert services removed and ProgramData retained
        if: always() && steps.install.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()

          foreach ($name in @('OpsIntel.Host', 'OpsIntel.AI')) {
            $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
            if ($svc) {
              $failures += "Service '$name' still present after uninstall (status: $($svc.Status))"
            }
          }

          $dataDir = Join-Path $env:ProgramData 'OpsIntel'
          if (-not (Test-Path $dataDir)) {
            $failures += "ProgramData\OpsIntel was removed on a plain uninstall (REMOVE_DATA was not set) — data should be retained."
          } else {
            Write-Host "ProgramData\OpsIntel retained as expected."
          }

          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Host "FAIL: $_" }
            throw ($failures -join '; ')
          }

      - name: Collect service Application-log excerpts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          foreach ($source in @('OpsIntel.Host', 'OpsIntel.AI')) {
            $out = Join-Path $PWD "eventlog-$source.txt"
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = $source } -MaxEvents 200 -ErrorAction SilentlyContinue |
              Sort-Object TimeCreated |
              Format-Table TimeCreated, Id, LevelDisplayName, Message -Wrap |
              Out-String -Width 300 |
              Out-File -FilePath $out -Encoding utf8
          }

      - name: Collect Host log files
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          $logsDir = Join-Path $env:ProgramData 'OpsIntel\logs'
          $dest = Join-Path $PWD 'host-logs'
          if (Test-Path $logsDir) {
            Copy-Item -Path $logsDir -Destination $dest -Recurse -Force
          } else {
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            "ProgramData\OpsIntel\logs did not exist at collection time." | Out-File (Join-Path $dest 'MISSING.txt')
          }

      - name: Upload install-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke-diagnostics
          path: |
            install.log
            uninstall.log
            eventlog-*.txt
            host-logs/**
          if-no-files-found: warn
          retention-days: 14

  # Pester install-matrix execution (tests/installer/Install.Tests.ps1) covers
  # a superset of the install-smoke job above (N-1 upgrade, repair) and is
  # intentionally NOT wired in as a required job yet: the upgrade/repair
  # scenarios need a snapshot of a previous release, which does not exist for
  # this Faz 0 skeleton (msi_kurulum_dagitim.md §9 Gaps). TODO(Faz 0 spike A):
  # wire Invoke-Pester -Path tests/installer/Install.Tests.ps1 -Tag Upgrade,Repair
  # once an N-1 build is available, or move it to a self-hosted Hyper-V runner.
